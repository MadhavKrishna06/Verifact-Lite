# VERIFACT-Lite configuration
# A resource-constrained reimplementation of the core VERIFACT methodology
# using open-source, locally hosted models. No paid API keys are required.

# ---------------------------------------------------------------------------
# Primary model. Used for answer generation, extraction, refinement,
# query generation, verification and recall entailment unless overridden.
# ---------------------------------------------------------------------------
model:
  name: Qwen2.5-3B-Instruct
  backend: ollama            # ollama | llama_cpp_server | llama_cpp_python
  model_id: qwen2.5:3b-instruct-q4_K_M
  quantization: Q4_K_M
  temperature: 0.1
  max_tokens: 2048
  timeout_s: 600

# ---------------------------------------------------------------------------
# Backend connection settings.
# llama_cpp_server expects an OpenAI-compatible /v1/chat/completions endpoint
# (e.g. `llama-server -m model.gguf --port 8080`).
# ---------------------------------------------------------------------------
backends:
  ollama:
    host: http://127.0.0.1:11434
  llama_cpp_server:
    base_url: http://127.0.0.1:8080/v1
    api_key: EMPTY
  llama_cpp_python:
    model_path: models/qwen2.5-3b-instruct-q4_k_m.gguf
    n_ctx: 8192
    n_gpu_layers: -1

# ---------------------------------------------------------------------------
# Answer generation. The answer under evaluation is generated exactly once
# and shared by every pipeline variant (baseline and VERIFACT-Lite).
# ---------------------------------------------------------------------------
generation:
  model_id: qwen2.5:3b-instruct-q4_K_M
  temperature: 0.7
  max_tokens: 400
  max_words: 130

# ---------------------------------------------------------------------------
# Detection ensemble. The paper uses GPT-4o + Llama 3.3-70B + Qwen 2.5-32B and
# takes the UNION of positive detections to prioritise recall. Here the judges
# are small local models, run sequentially. Any number of judges is supported.
# ---------------------------------------------------------------------------
judges:
  - alias: qwen
    name: Qwen2.5-3B-Instruct
    backend: ollama
    model_id: qwen2.5:3b-instruct-q4_K_M
    temperature: 0.0
    max_tokens: 192
    weight: 0.6
  - alias: llama
    name: Llama-3.2-3B-Instruct
    backend: ollama
    model_id: llama3.2:3b-instruct-q4_K_M
    temperature: 0.0
    max_tokens: 192
    weight: 0.4

ensemble:
  strategy: union            # union | majority | weighted
  weighted_threshold: 0.5

# ---------------------------------------------------------------------------
# Fact extraction (STEP 1). Deliberately a faithful, weak SAFE-style
# baseline: sentence-level decomposition + pronoun-only decontextualization.
# Its known failure modes are what VERIFACT-Lite repairs.
# ---------------------------------------------------------------------------
extraction:
  decontextualize: true      # SAFE-style pronoun/vague-reference resolution
  max_facts_per_sentence: 8

# ---------------------------------------------------------------------------
# Word mapping (STEP 2B). Longest-common-substring coverage, per sentence,
# over the original response, following Algorithm 1 of the paper.
# ---------------------------------------------------------------------------
word_mapping:
  min_span_chars: 12         # ignore punctuation-sized uncovered spans
  min_span_words: 3

# ---------------------------------------------------------------------------
# Missing relation detection (STEP 2C). PDTB level-1 relations; VERIFACT
# focuses on temporal and contingency.
# ---------------------------------------------------------------------------
missing_relation:
  target_relations: [temporal, contingency]
  rule_prefilter: false      # proposed improvement 6, off by default
  coverage_check: true       # do not add a fact the fact set already covers

# ---------------------------------------------------------------------------
# Evidence retrieval (STEP 4). Free Wikipedia/Wikimedia search; no Serper.
# ---------------------------------------------------------------------------
retrieval:
  source: wikipedia
  api_url: https://en.wikipedia.org/w/api.php
  user_agent: "VERIFACT-Lite/0.1 (local research reimplementation)"
  queries_per_fact: 3
  pages_per_query: 3
  max_pages_per_fact: 6
  top_k: 5
  ranker: bm25               # bm25 | tfidf
  min_paragraph_chars: 120
  cache_dir: data/evidence
  request_delay_s: 0.2
  offline_only: false        # true = use only cached evidence, never network

# ---------------------------------------------------------------------------
# Verification (STEP 4). SUPPORTED / CONTRADICTED / UNDECIDED.
# Absence of evidence is never treated as support.
# ---------------------------------------------------------------------------
verification:
  labels: [SUPPORTED, CONTRADICTED, UNDECIDED]
  evidence_snippets: 5

# ---------------------------------------------------------------------------
# Recall. Reference facts come from data/mini_reference.jsonl and are matched
# against the response by lexical similarity + local LLM entailment.
# ---------------------------------------------------------------------------
recall:
  similarity_threshold: 0.18   # lexical gate before the LLM entailment call
  llm_confirmation: true

# ---------------------------------------------------------------------------
# Caching. hash(model + prompt + parameters) -> response.
# ---------------------------------------------------------------------------
cache:
  enabled: true
  dir: cache

paths:
  challenge_set: data/challenge_set.jsonl
  mini_reference: data/mini_reference.jsonl
  outputs: outputs

run:
  seed: 2024
  limit: null                 # null = all questions in the challenge set
